<!doctype html><html lang="ja"><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Wrecking Crew-like</title><link rel="stylesheet" href="style.css">
<body class="title">
<div id="top"><button id="bBack" class="np">◀ もどる</button><span id="msg"></span></div>
<div id="stage"><canvas id="cv" width="640" height="480"></canvas>
 <div id="titlebox"><h1>WRECKING<br>CREW-like</h1><button id="bPlay">▶ あそぶ</button><button id="bEdit">✎ つくる</button></div></div>
<div id="pad" class="pl"><div id="dpad"><i>▲</i><i>◀</i><i>▶</i><i>▼</i></div><div id="hbtn">🔨</div></div>
<div id="editor" class="ed">
 <div id="palette"></div>
 <div class="row" id="runnerDirection"><span>直進敵の開始方向</span><button type="button" data-runner-dir="-1">← 左向き</button><button type="button" data-runner-dir="1">右向き →</button></div>
 <div class="row"><button id="bTest">▶ テスト</button><button id="bSave">保存</button><button id="bLoad">読込</button><button id="bClear">全消し</button><button id="bParam">⚙ 設定</button><button id="bCode">コード</button><button id="zoomOut" type="button" aria-label="ステージを縮小">−</button><button id="zoomReset" type="button">倍率リセット</button><button id="zoomIn" type="button" aria-label="ステージを拡大">＋</button><span id="zoomLabel">100%</span>
  <label>列 <input id="cw" type="number" min="8" max="40"></label><label>行 <input id="ch" type="number" min="6" max="30"></label></div>
</div>
<div id="sheet" hidden><div class="sbox"><button id="sClose">✕ 閉じる</button>
 <section id="sParam"><div id="pbody"></div><button id="pReset">初期値に戻す</button></section>
 <section id="sCode"><p>マップコード（コピー/貼り付け）</p><textarea id="lv"></textarea><button id="lvLoad">読み込む</button></section></div></div>
<script src="js/config.js"></script>
<script src="js/core/gfx.js"></script>

<script src="js/enemies/fastchaser.js"></script>
<script src="js/enemies/runner.js"></script>

<script src="js/enemies/fireball.js"></script>
